<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Linkbygger</title>
  <meta name="description" content="Byg links til MSF.DK med faste UTM-koder.">
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&family=Geist+Mono:wght@400&display=swap">
  <link rel="stylesheet" href="style.css">
  <script>
  (function () {
    var KEY = "linkbygger-theme";
    function pref() { try { return localStorage.getItem(KEY) || "auto"; } catch (e) { return "auto"; } }
    function save(v) { try { localStorage.setItem(KEY, v); } catch (e) {} }
    function apply() {
      var p = pref(), hr = new Date().getHours();
      var dark = p === "dark" || (p === "auto" && (hr >= 19 || hr < 7));
      document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
    }
    window.linkbyggerTheme = { pref: pref, save: save, apply: apply };
    apply();
    setInterval(apply, 60000);
  })();
  </script>
</head>
<body>
  <button class="theme" id="theme" type="button" aria-label="Skift tema"></button>
  <div class="module">
    <header class="top">
      <div class="name">Linkbygger</div>
      <div class="meta" id="meta"></div>
    </header>
    <main class="stage" id="stage" aria-live="polite"></main>
  </div>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
