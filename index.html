<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Linkbygger</title>
  <meta name="description" content="Byg links til MSF.DK med faste UTM-koder.">
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&family=Geist+Mono:wght@400&display=swap">
  <style>
:root {
  color-scheme: light;
  --paper: #FFFFFF;
  --ink: rgba(0, 0, 0, .9);
  --soft: rgba(0, 0, 0, .38);
  --hair: rgba(0, 0, 0, .12);
  --red: #EE0000;
  --desc: rgba(0, 0, 0, .62);
  --hover: rgba(0, 0, 0, .035);
  --ph: rgba(0, 0, 0, .2);
  --off: rgba(0, 0, 0, .12);
  --f: "Geist", "Neue Haas Grotesk Display", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --f-mono: "Geist Mono", ui-monospace, Consolas, monospace;
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --paper: #121212;
  --ink: rgba(255, 255, 255, .92);
  --soft: rgba(255, 255, 255, .48);
  --hair: rgba(255, 255, 255, .14);
  --red: #FF4D4D;
  --desc: rgba(255, 255, 255, .7);
  --hover: rgba(255, 255, 255, .06);
  --ph: rgba(255, 255, 255, .25);
  --off: rgba(255, 255, 255, .14);
}
* { box-sizing: border-box; }
html, body { background: var(--paper); transition: background .3s, color .3s; }
body { margin: 0; color: var(--ink); font: 400 20px/1.3 var(--f); letter-spacing: -.01em; padding-inline: clamp(16px, 3vw, 40px); padding-block: 22px; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: left; letter-spacing: inherit; }

.top { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; font-size: 20px; }
.top .name { display: flex; gap: .35em; align-items: baseline; }
.top .meta { color: var(--soft); }
.top .meta button:hover { color: var(--ink); }

html, body { height: 100%; }
body { display: flex; flex-direction: column; }
.module { margin: auto; padding-block: 40px; width: 100%; max-width: 760px; display: grid; gap: clamp(28px, 5vh, 48px); }
.stage { display: grid; gap: clamp(24px, 4vh, 36px); }
.trail { display: flex; flex-wrap: wrap; gap: 0 .6em; color: var(--soft); font-size: 20px; }
.trail:empty { display: none; }
.trail button:hover { color: var(--ink); }
.trail span.sep { color: var(--hair); }

h1 { margin: 0; font-weight: 500; font-size: clamp(34px, 5vw, 60px); line-height: 1.05; letter-spacing: -.025em; text-wrap: balance; max-width: 20ch; }
.sub { margin: 0; color: var(--soft); max-width: 48ch; }

.list { border-top: 1px solid var(--hair); }
.opt { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 16px; width: 100%;
  border-bottom: 1px solid var(--hair); padding: 18px 12px; transition: background .12s ease-in-out; }
.opt .t { font-size: clamp(22px, 2.6vw, 30px); line-height: 1.15; letter-spacing: -.015em; font-weight: 500; }
.opt .d { color: var(--desc); font-size: 18px; text-align: right; }
.opt:hover, .opt:focus-visible { background: var(--hover); }
.opt .tt { display: grid; gap: 4px; min-width: 0; }
.opt .ov { font-size: 15px; line-height: 1.35; color: var(--soft); letter-spacing: 0; }

.form { display: grid; gap: 28px; max-width: 900px; }
.field { display: grid; gap: 6px; }
.field label { color: var(--soft); font-size: 18px; }
.field input { width: 100%; border: 0; border-bottom: 1px solid var(--ink); background: transparent; color: var(--ink);
  font: 400 clamp(20px, 2.2vw, 26px)/1.3 var(--f); letter-spacing: -.01em; padding: 6px 0 10px; border-radius: 0; }
.field input::placeholder { color: var(--ph); }
.field input:focus { outline: none; border-bottom-color: var(--red); }
.note { margin: 0; color: var(--soft); font-size: 18px; }
.note b { font: 400 17px var(--f-mono); color: var(--ink); letter-spacing: 0; }
.err { margin: 0; color: var(--red); font-size: 18px; }
.amounts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.amt { display: flex; align-items: baseline; gap: 6px; border-bottom: 1px solid var(--ink); }
.amt:focus-within { border-bottom-color: var(--red); }
.amt input { border: 0; padding: 6px 0 10px; min-width: 0; }
.amt span { color: var(--soft); font-size: 18px; }


.go { font-size: 18px; font-weight: 500; letter-spacing: 0; line-height: 1; justify-self: start;
  background: var(--ink); color: var(--paper); border-radius: 999px; padding: 15px 26px; transition: background .15s; }
.go:hover { background: var(--red); }
.go:disabled { background: var(--off); color: var(--soft); cursor: default; }

.linkout { font: 400 clamp(16px, 1.6vw, 20px)/1.6 var(--f-mono); letter-spacing: -.01em; word-break: break-all; margin: 0; max-width: 1100px; }
.linkout .k { color: var(--soft); }
.actions { display: flex; flex-wrap: wrap; gap: 8px 40px; align-items: baseline; }
.actions .go.small, .small { font-size: 20px; letter-spacing: -.01em; font-weight: 400; }
.small { color: var(--soft); }
.small:hover { color: var(--ink); }
.ok { color: var(--red); font-size: 20px; }

.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 24px 48px; border-top: 1px solid var(--hair); padding-top: 20px; max-width: 1100px; }
.cols h2 { margin: 0 0 8px; font: 400 18px var(--f); color: var(--soft); letter-spacing: -.01em; }
.parts { display: grid; grid-template-columns: max-content 1fr; gap: 2px 20px; margin: 0; font: 15px/1.6 var(--f-mono); letter-spacing: 0; }
.parts dt { color: var(--soft); }
.parts dd { margin: 0; word-break: break-all; }
.adscode { font: 15px/1.6 var(--f-mono); letter-spacing: 0; word-break: break-all; margin: 8px 0 0; }

.back { color: var(--soft); font-size: 20px; justify-self: start; }
.back:hover { color: var(--ink); }

button:focus-visible, input:focus-visible { outline: 1px solid var(--red); outline-offset: 4px; }
@media (prefers-reduced-motion: no-preference) {
  .enter h1 { animation: rise .35s cubic-bezier(.2,.7,.2,1); }
  .enter .list, .enter .form, .enter .linkout { animation: rise .45s cubic-bezier(.2,.7,.2,1); }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
}
@media (max-width: 560px) {
  .opt { grid-template-columns: 1fr auto; gap: 2px 12px; }
  .opt .d { grid-column: 1; grid-row: 2; text-align: left; font-size: 16px; }
  .top, .trail, .back, .small, .ok { font-size: 17px; }
}
.opt.off { cursor: default; }
.opt.off:hover { background: none; }
.opt.off .t { text-decoration: line-through; color: var(--soft); }
.theme { position: fixed; top: 18px; right: clamp(16px, 3vw, 40px); z-index: 10; font-size: 16px; color: var(--soft);
  border: 1px solid var(--hair); border-radius: 999px; padding: 8px 14px; background: var(--paper); }
.theme:hover { color: var(--ink); border-color: var(--ink); }
  </style>
  <script>
  (function () {
    var KEY = "linkbygger-theme";
    function pref() { try { return localStorage.getItem(KEY) || "auto"; } catch (e) { return "auto"; } }
    function save(v) { try { localStorage.setItem(KEY, v); } catch (e) {} }
    function apply() {
      var p = pref(), hr = new Date().getHours();
      var dark = p === "dark" || (p === "auto" && (hr >= 19 || hr < 7));
      document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
    }
    window.linkbyggerTheme = { pref: pref, save: save, apply: apply };
    apply();
    setInterval(apply, 60000);
  })();
  </script>
</head>
<body>
  <button class="theme" id="theme" type="button" aria-label="Skift tema"></button>
  <div class="module">
    <header class="top">
      <div class="name">Linkbygger</div>
      <div class="meta" id="meta"></div>
    </header>
    <main class="stage" id="stage" aria-live="polite"></main>
  </div>
<script>
(function () {
  var CHANNELS = [
    { v: "facebook", t: "Facebook", d: "Opslag, story, annonce", social: true },
    { v: "instagram", t: "Instagram", d: "Opslag, story, reel, bio", social: true },
    { v: "linkedin", t: "LinkedIn", d: "Opslag, annonce", social: true },
    { v: "sfmc", t: "Nyhedsbrev", d: "Mail fra SFMC", medium: "email" },
    { v: "outdoor", t: "Poster og print", d: "QR-kode, trykt link", medium: "print" },
    { v: "msf-web", t: "MSF.DK", d: "Banner, popup", medium: "internal" }
  ];
  var FORMATS = {
    facebook: [
      { v: "post", t: "Opslag", d: "Billede, tekst eller link" },
      { v: "carousel", t: "Karrusel", d: "Flere billeder i ét opslag" },
      { v: "video", t: "Video", d: "Længere video", o: "Overlapper med Reel. Korte videoer er reels." },
      { v: "reel", t: "Reel", d: "Kort video", o: "Vises også i feed som video." },
      { v: "story", t: "Story", d: "Forsvinder efter 24 timer" }
    ],
    instagram: [
      { v: "post", t: "Opslag", d: "Ét billede", o: "Flere billeder? Vælg Karrusel." },
      { v: "carousel", t: "Karrusel", d: "Flere billeder eller videoer" },
      { v: "reel", t: "Reel", d: "Video", o: "Alle videoer på Instagram er reels." },
      { v: "story", t: "Story", d: "Forsvinder efter 24 timer" },
      { v: "link_in_bio", t: "Link i bio", d: "Linket på profilen" }
    ],
    linkedin: [
      { v: "post", t: "Opslag", d: "Tekst, billede eller link" },
      { v: "document", t: "Karrusel", d: "PDF, man bladrer i" },
      { v: "video", t: "Video", d: "Video i feedet" },
      { v: "article", t: "Artikel", d: "Længere tekst på LinkedIn" }
    ],
    meta_paid: [
      { v: "image", t: "Billede", d: "Enkelt billede", o: "Kører også i story og reels. Placeringen kommer med automatisk." },
      { v: "video", t: "Video", d: "Enkelt video", o: "Kører også som reel og story. Placeringen kommer med automatisk." },
      { v: "carousel", t: "Karrusel", d: "Flere billeder eller videoer" },
      { v: "collection", t: "Collection", d: "Forside med flere billeder" },
      { v: "leadcard", t: "Lead-annonce", d: "Formular i Meta", o: "Kan være billede eller video. Vælg Lead-annonce." }
    ],
    linkedin_paid: [
      { v: "image", t: "Billede", d: "Enkelt billede" },
      { v: "video", t: "Video", d: "Enkelt video" },
      { v: "carousel", t: "Karrusel", d: "Flere billeder", o: "Karrusel er billeder. Er det en PDF, vælg Dokument." },
      { v: "document", t: "Dokument", d: "PDF i feedet" },
      { v: "leadcard", t: "Lead-annonce", d: "Formular i LinkedIn", o: "Kan være billede eller video. Vælg Lead-annonce." },
      { v: "message", t: "Besked", d: "Sendes i indbakken" }
    ],
    print: [{ v: "poster", t: "Poster" }, { v: "flyer", t: "Flyer" }],
    internal: [{ v: "banner", t: "Banner" }, { v: "popup", t: "Popup" }]
  };
  var CAMPAIGNS = [
    { v: "evergreen", t: "Nej", d: "Almindeligt indhold" },
    { v: "eoy2026", t: "End of Year 2026", d: "eoy2026" }
  ];

  var GIFTS = [
    { v: "alle", t: "Alle gavebeviser", d: "Oversigten", path: "/produkt-kategori/gavebeviser/" },
    { v: "valgfrit_tekst", t: "Valgfrit beløb og tekst", d: "Print selv", path: "/produkt/gavebevis-print-selv-valgfrit-beloeb-og-tekst/" },
    { v: "valgfrit", t: "Valgfrit beløb", d: "Print selv", path: "/produkt/gavebevis-print-selv-valgfrit-beloeb/" },
    { v: "uden_beloeb", t: "Valgfrit beløb, uden synligt beløb", d: "Print selv", path: "/produkt/gavebevis-valgfrit-beloeb-og-tekst-uden-synligt-beloeb/" },
    { v: "foedselskit", t: "Fødselskit", d: "Print selv", path: "/produkt/foedselskit/" },
    { v: "boernevaccination", t: "Børnevaccination", d: "Print selv", path: "/produkt/boernevaccination/" },
    { v: "kirurg", t: "Udstyr til kirurgen", d: "Print selv", path: "/produkt/udstyr-til-kirurgen/" },
    { v: "malaria", t: "Malaria-behandling", d: "Print selv", path: "/produkt/malaria-behandling/" },
    { v: "vand", t: "Vand- og sanitetskit", d: "Print selv", path: "/produkt/vand-og-sanitetskit/" },
    { v: "kanyler", t: "Sterile kanyler", d: "Print selv", path: "/produkt/sterile-kanyler/" },
    { v: "gift_certificate", t: "Gift certificate", d: "Engelsk", path: "/produkt/gift-certificate-printable-optional-donation-amount-and-text/" }
  ];
  var GIFTS_READY = false;

  var DEFAULT_CODE_ONE = "2822", DEFAULT_CODE_FP = "2824";

  var s = fresh();
  function fresh() {
    return { channel: null, paid: null, format: null, campaign: null,
      codeOne: "", codeFp: "",
      useAmounts: null, amtOne: ["", "", ""], amtRec: ["", "", ""],
      url: "", topic: "", mailCampaign: "", step: 0, mode: null, flow: "link", gift: null };
  }
  function digits(x) { return (x || "").replace(/\D/g, ""); }
  function amountList(arr) { return arr.map(digits).filter(function (a) { return a && +a > 0; }).join(","); }
  function extras() {
    var e = {};
    var am = s.useAmounts && amountsAllowed();
    if (am && amountList(s.amtOne)) e["donation-amounts"] = amountList(s.amtOne);
    if (am && amountList(s.amtRec)) e["donation-amounts-recurring"] = amountList(s.amtRec);
    var one = digits(s.codeOne) || (isEmail() ? DEFAULT_CODE_ONE : "");
    var fp = digits(s.codeFp) || (isEmail() ? DEFAULT_CODE_FP : "");
    if (one) e.campaign_code = one;
    if (fp) e.campaign_code_recurring = fp;
    return e;
  }
  function isAd() { return isSocial() && s.paid === true; }
  function amountsAllowed() { return isAd() || medium() === "email"; }
  var $ = function (id) { return document.getElementById(id); };

  function clean(x) {
    return (x || "").toLowerCase().trim()
      .replace(/æ/g, "ae").replace(/ø/g, "oe").replace(/å/g, "aa")
      .normalize("NFD").replace(/[̀-ͯ]/g, "")
      .replace(/[^a-z0-9_-]+/g, "_").replace(/_+/g, "_").replace(/^[_-]+|[_-]+$/g, "");
  }
  function ch() { return CHANNELS.filter(function (c) { return c.v === s.channel; })[0]; }
  function isSocial() { var c = ch(); return !!(c && c.social); }
  function medium() { var c = ch(); if (!c) return null; return c.social ? (s.paid ? "paid-social" : "organic") : c.medium; }
  function formats() {
    var c = ch(); if (!c) return [];
    if (c.social) return s.paid ? (c.v === "linkedin" ? FORMATS.linkedin_paid : FORMATS.meta_paid) : FORMATS[c.v];
    return FORMATS[c.medium];
  }
  function isEmail() { return medium() === "email"; }
  function isGift() { return s.flow === "gift"; }
  function gift() { return GIFTS.filter(function (g) { return g.v === s.gift; })[0]; }
  function campaign() { return isGift() ? "gavebevis" : isEmail() ? (clean(s.mailCampaign) || null) : s.campaign; }
  function content() {
    if (isGift()) return s.gift;
    if (isEmail()) return null;
    var t = clean(s.topic); return s.format ? (t ? s.format + "_" + t : s.format) : null;
  }

  function steps() {
    if (isGift()) {
      var g = ["gift", "channel"];
      if (!s.channel || isSocial()) g.push("paid");
      g.push("done");
      return g;
    }
    var l = ["channel"];
    if (!s.channel || isSocial()) l.push("paid");
    if (!isEmail()) l.push("format", "campaign");
    l.push("codes");
    l.push("url", "done");
    return l;
  }
  function cur() { return steps()[s.step]; }
  function go(i) { s.mode = null; s.step = Math.max(0, Math.min(i, steps().length - 1)); draw(true); window.scrollTo({ top: 0 }); }
  function openAmounts() { s.mode = "amounts"; draw(true); window.scrollTo({ top: 0 }); setTimeout(function () { var i = $("amtOne0"); if (i) i.focus(); }, 0); }
  function closeAmounts() { s.useAmounts = !!(amountList(s.amtOne) || amountList(s.amtRec)); s.mode = null; draw(true); window.scrollTo({ top: 0 }); }
  function next() { go(s.step + 1); }

  function parseUrl(raw) {
    raw = (raw || "").trim();
    if (!raw) return { url: null, err: "" };
    if (!/^https?:\/\//i.test(raw)) raw = "https://" + raw;
    try {
      var u = new URL(raw);
      if (!/(^|\.)msf\.dk$/i.test(u.hostname)) return { url: null, err: "Linket skal gå til MSF.DK." };
      u.protocol = "https:";
      return { url: u, err: "" };
    } catch (e) { return { url: null, err: "Det ligner ikke en webadresse. Kopiér hele adressen fra browseren." }; }
  }

  function h(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function opt(item, selected, onPick, extra) {
    var b = h("button", "opt" + (selected ? " sel" : "") + (extra ? " " + extra : "")); b.type = "button";
    var tt = h("span", "tt"); tt.appendChild(h("span", "t", item.t));
    if (item.o) tt.appendChild(h("span", "ov", item.o));
    b.appendChild(tt);
    b.appendChild(h("span", "d", item.d || ""));
    b.addEventListener("click", onPick);
    return b;
  }
  function label(key) {
    if (key === "gift") return gift().t;
    if (key === "channel") return ch().t;
    if (key === "paid") return s.paid ? "Annonce" : "Organisk";
    if (key === "format") { var f = formats().filter(function (x) { return x.v === s.format; })[0]; return f ? f.t : ""; }
    if (key === "campaign") return s.campaign === "evergreen" ? "Ingen kampagne" : campaign();
    if (key === "amounts") {
      var ea = extras(), a = [ea["donation-amounts"], ea["donation-amounts-recurring"]].filter(Boolean);
      return a.length ? "Beløb " + a.join(" · ") : "Standardbeløb";
    }
    if (key === "codes") {
      var ec = extras(), k = [ec.campaign_code, ec.campaign_code_recurring].filter(Boolean);
      return k.length ? "Koder " + k.join("/") : "Ingen koder";
    }
    return "";
  }

  function draw(animate) {
    var st = cur(), all = steps(), total = all.length - 1;
    var stage = $("stage"); stage.innerHTML = "";
    stage.classList.remove("enter"); if (animate) { void stage.offsetWidth; stage.classList.add("enter"); }

    var meta = $("meta"); meta.innerHTML = "";
    if (s.mode === "amounts") meta.textContent = "Ekstra";
    else if (st === "done") meta.textContent = "Færdig";
    else meta.textContent = (s.step + 1) + " / " + total;

    var trail = h("nav", "trail"); trail.setAttribute("aria-label", "Dine valg");
    all.forEach(function (key, i) {
      if ((i >= s.step && !s.mode) || key === "url" || key === "done") return;
      if (trail.childNodes.length) trail.appendChild(h("span", "sep", "/"));
      var b = h("button", null, label(key)); b.type = "button"; b.setAttribute("aria-label", "Ret: " + label(key));
      b.addEventListener("click", function () { go(i); });
      trail.appendChild(b);
    });
    stage.appendChild(trail);

    if (st === "gift") {
      stage.appendChild(h("h1", null, "Hvilket gavebevis?"));
      var lg = h("div", "list");
      GIFTS.forEach(function (g) {
        lg.appendChild(opt(g, s.gift === g.v, function () { s.gift = g.v; s.url = "https://msf.dk" + g.path; next(); }));
      });
      stage.appendChild(lg);
    }

    if (st === "channel") {
      stage.appendChild(h("h1", null, "Hvor skal linket deles?"));
      var l = h("div", "list");
      CHANNELS.forEach(function (c) {
        l.appendChild(opt(c, s.channel === c.v, function () { if (s.channel !== c.v) { s.channel = c.v; s.paid = null; s.format = null; } next(); }));
      });
      if (!isGift()) {
        var gr = opt({ t: "Gavebeviser", d: GIFTS_READY ? "Link til et gavebevis" : "Tilgår snarest" }, false, function () {
          if (!GIFTS_READY) return;
          s = fresh(); s.flow = "gift"; draw(true);
        }, GIFTS_READY ? "" : "off");
        gr.disabled = !GIFTS_READY;
        l.appendChild(gr);
      }
      stage.appendChild(l);
    }

    if (st === "paid") {
      stage.appendChild(h("h1", null, "Betaler vi for at vise det?"));
      var l2 = h("div", "list");
      l2.appendChild(opt({ t: "Nej", d: "Almindeligt opslag" }, s.paid === false, function () { if (s.paid !== false) s.format = null; s.paid = false; next(); }));
      l2.appendChild(opt({ t: "Ja", d: "Annonce eller boost" }, s.paid === true, function () { if (s.paid !== true) s.format = null; s.paid = true; next(); }));
      stage.appendChild(l2);
    }

    if (st === "format") {
      stage.appendChild(h("h1", null, "Hvad slags " + (isSocial() ? (s.paid ? "annonce" : "opslag") : "indhold") + "?"));
      var l3 = h("div", "list");
      formats().forEach(function (f) { l3.appendChild(opt(f, s.format === f.v, function () { s.format = f.v; next(); })); });
      stage.appendChild(l3);
    }

    if (st === "campaign") {
      stage.appendChild(h("h1", null, "Hører det til en kampagne?"));
      stage.appendChild(h("p", "sub", "Samme kampagne i alle kanaler, så den kan ses samlet."));
      var l4 = h("div", "list");
      CAMPAIGNS.forEach(function (c) { l4.appendChild(opt(c, s.campaign === c.v, function () { s.campaign = c.v; next(); })); });
      stage.appendChild(l4);
    }

    if (st === "codes" || s.mode === "amounts") {
      function numField(id, text, get, set, max, ph) {
        var fd = h("div", "field");
        var lbl = h("label", null, text); lbl.htmlFor = id;
        var ci = document.createElement("input"); ci.id = id; ci.type = "text"; ci.inputMode = "numeric"; ci.autocomplete = "off";
        ci.placeholder = ph; ci.maxLength = max; ci.value = get();
        ci.addEventListener("input", function () { var d = digits(ci.value).slice(0, max); if (d !== ci.value) ci.value = d; set(d); });
        ci.addEventListener("keydown", function (e) { if (e.key === "Enter") next(); });
        fd.appendChild(lbl); fd.appendChild(ci);
        return fd;
      }
      function amountRow(title, key, idp, ph) {
        var fd = h("div", "field");
        fd.appendChild(h("label", null, title));
        var row = h("div", "amounts");
        [0, 1, 2].forEach(function (i) {
          var ai = document.createElement("input"); ai.id = idp + i; ai.type = "text"; ai.inputMode = "numeric"; ai.autocomplete = "off";
          ai.placeholder = ph[i]; ai.maxLength = 6; ai.value = s[key][i];
          ai.setAttribute("aria-label", title + ", beløb " + (i + 1));
          ai.addEventListener("input", function () { var d = digits(ai.value).slice(0, 6); if (d !== ai.value) ai.value = d; s[key][i] = d; });
          ai.addEventListener("keydown", function (e) { if (e.key === "Enter") next(); });
          var cell = h("div", "amt"); cell.appendChild(ai); cell.appendChild(h("span", null, "kr."));
          row.appendChild(cell);
        });
        fd.appendChild(row);
        return fd;
      }


      if (s.mode === "amounts") {
        stage.appendChild(h("h1", null, "Beløbsforslag"));
        stage.appendChild(h("p", "sub", "Overskriver beløbene i donationsformularen. Tomme felter springes over."));
        var fa = h("div", "form");
        fa.appendChild(amountRow("One-off", "amtOne", "amtOne", ["150", "300", "500"]));
        fa.appendChild(amountRow("Fast, pr. måned", "amtRec", "amtRec", ["100", "150", "200"]));
        var acts2 = h("div", "actions");
        var up = h("button", "go", "Opdater link"); up.type = "button";
        up.addEventListener("click", closeAmounts);
        acts2.appendChild(up);
        if (s.useAmounts) {
          var rm = h("button", "small", "Fjern beløbsforslag"); rm.type = "button";
          rm.addEventListener("click", function () { s.amtOne = ["", "", ""]; s.amtRec = ["", "", ""]; closeAmounts(); });
          acts2.appendChild(rm);
        }
        fa.appendChild(acts2);
        stage.appendChild(fa);
      }

      if (st === "codes" && !s.mode) {
        stage.appendChild(h("h1", null, "Kampagnekoder"));
        stage.appendChild(h("p", "sub", "Udfyld én, begge eller ingen."));
        var fk = h("div", "form");
        fk.appendChild(numField("codeOne", "Kampagnekode One-off", function () { return s.codeOne; }, function (v) { s.codeOne = v; }, 4, isEmail() ? "Hvis ingen valgt: " + DEFAULT_CODE_ONE : "Indtast kampagnekode"));
        fk.appendChild(numField("codeFp", "Kampagnekode Feltpartner", function () { return s.codeFp; }, function (v) { s.codeFp = v; }, 4, isEmail() ? "Hvis ingen valgt: " + DEFAULT_CODE_FP : "Indtast kampagnekode"));
        var nk = h("button", "go", "Videre"); nk.type = "button";
        nk.addEventListener("click", next);
        fk.appendChild(nk);
        stage.appendChild(fk);
        setTimeout(function () { var i = $("codeOne"); if (i) i.focus(); }, 0);
      }
    }

    if (st === "url") {
      stage.appendChild(h("h1", null, "Hvor skal brugeren lande?"));
      var fm2 = h("div", "form");
      var f1 = h("div", "field");
      var ul = h("label", null, "Side på MSF.DK. Kopiér adressen fra browseren."); ul.htmlFor = "url";
      var u = document.createElement("input"); u.id = "url"; u.type = "url"; u.placeholder = "msf.dk/stoet"; u.autocomplete = "off"; u.spellcheck = false; u.value = s.url;
      var err = h("p", "err"); err.hidden = true;
      f1.appendChild(ul); f1.appendChild(u); f1.appendChild(err);
      var f2 = h("div", "field");
      var mail = isEmail(), tkey = mail ? "mailCampaign" : "topic";
      var tl = h("label", null, mail ? "Kampagne, valgfrit" : "Emne, valgfrit"); tl.htmlFor = tkey;
      var t = document.createElement("input"); t.id = tkey; t.type = "text"; t.placeholder = mail ? "Gaza" : "Sudan"; t.autocomplete = "off"; t.value = s[tkey];
      f2.appendChild(tl); f2.appendChild(t);
      var mk = h("button", "go", "Lav link"); mk.type = "button";
      function check() { var p = parseUrl(u.value); err.hidden = !p.err; err.textContent = p.err; mk.disabled = !p.url; }
      u.addEventListener("input", function () { s.url = u.value; check(); });
      t.addEventListener("input", function () { s[tkey] = t.value; });
      [u, t].forEach(function (el) { el.addEventListener("keydown", function (e) { if (e.key === "Enter" && !mk.disabled) next(); }); });
      mk.addEventListener("click", next);
      fm2.appendChild(f1); fm2.appendChild(f2); fm2.appendChild(mk);
      stage.appendChild(fm2);
      check();
      setTimeout(function () { u.focus(); }, 0);
    }

    if (st === "done" && !s.mode) {
      var p = parseUrl(s.url).url;
      var vals = { utm_source: s.channel, utm_medium: medium(), utm_campaign: campaign(), utm_content: content() };
      Object.keys(vals).forEach(function (k) { if (!vals[k]) delete vals[k]; });
      var codes = extras();
      Object.keys(codes).forEach(function (k) { p.searchParams.set(k, codes[k]); });
      Object.keys(vals).forEach(function (k) { p.searchParams.set(k, vals[k]); });
      Object.keys(codes).forEach(function (k) { vals[k] = codes[k]; });
      var href = p.toString().replace(/%2C/gi, ",");

      stage.appendChild(h("h1", null, "Dit link er klar."));
      var link = h("p", "linkout");
      var q = href.indexOf("?");
      link.appendChild(document.createTextNode(href.slice(0, q + 1)));
      href.slice(q + 1).split("&").forEach(function (pair, i) {
        if (i) link.appendChild(h("span", "k", "&"));
        var eq = pair.indexOf("=");
        link.appendChild(h("span", "k", pair.slice(0, eq + 1)));
        link.appendChild(document.createTextNode(pair.slice(eq + 1)));
      });
      stage.appendChild(link);

      var acts = h("div", "actions");
      var cp = h("button", "go", "Kopiér"); cp.type = "button";
      var ok = h("span", "ok", "");
      cp.addEventListener("click", function () {
        var fallback = function () {
          var r = document.createRange(); r.selectNodeContents(link);
          var sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
          ok.textContent = "Markeret. Tryk Ctrl+C.";
        };
        try { navigator.clipboard.writeText(href).then(function () { ok.textContent = "Kopieret"; }, fallback); } catch (e) { fallback(); }
      });
      var same = h("button", "small", "Samme kampagne, ny kanal"); same.type = "button";
      same.addEventListener("click", function () { var keep = { campaign: s.campaign, codeOne: s.codeOne, codeFp: s.codeFp,
        useAmounts: s.useAmounts, amtOne: s.amtOne.slice(), amtRec: s.amtRec.slice(), url: s.url, topic: s.topic, mailCampaign: s.mailCampaign }; s = fresh(); Object.assign(s, keep); draw(true); });
      var nw = h("button", "small", "Start forfra"); nw.type = "button";
      nw.addEventListener("click", function () { var fl = s.flow; s = fresh(); s.flow = fl; draw(true); });
      acts.appendChild(cp); acts.appendChild(ok); acts.appendChild(same); acts.appendChild(nw);
      stage.appendChild(acts);

      if (amountsAllowed()) {
        var more = h("div", "list");
        more.appendChild(opt({ t: s.useAmounts ? "Ret beløbsforslag →" : "Tilføj beløbsforslag →",
          d: s.useAmounts ? label("amounts") : "Egne beløb i donationsformularen" }, false, openAmounts, "more"));
        stage.appendChild(more);
      }

      var cols = h("div", "cols");
      var c1 = h("div"); c1.appendChild(h("h2", null, "Koderne"));
      var dl = h("dl", "parts");
      Object.keys(vals).forEach(function (k) { dl.appendChild(h("dt", null, k)); dl.appendChild(h("dd", null, vals[k])); });
      c1.appendChild(dl); cols.appendChild(c1);
      if (isSocial() && s.paid) {
        var c2 = h("div"); c2.appendChild(h("h2", null, "Annonce i Ads Manager? Sæt dette under URL-parametre"));
        var adsParams = "utm_source=" + s.channel + "&utm_medium=paid-social&utm_campaign=" + campaign() + "&utm_content={{ad.name}}"
          + (s.channel === "linkedin" ? "" : "&utm_term={{placement}}");
        Object.keys(codes).forEach(function (k) { adsParams += "&" + k + "=" + codes[k]; });
        c2.appendChild(h("p", "adscode", adsParams));
        cols.appendChild(c2);
      }
      stage.appendChild(cols);
    }

    if (s.step > 0 || isGift()) {
      var back = h("button", "back", "Tilbage"); back.type = "button";
      back.addEventListener("click", function () {
        if (s.mode) { s.mode = null; draw(true); }
        else if (s.step === 0) { s = fresh(); draw(true); }
        else go(s.step - 1);
      });
      stage.appendChild(back);
    }
  }


  var T = window.linkbyggerTheme, NAMES = { auto: "Auto", light: "Lys", dark: "Mørk" }, ORDER = ["auto", "light", "dark"];
  function themeLabel() { $("theme").textContent = "Tema: " + NAMES[T.pref()]; }
  $("theme").addEventListener("click", function () {
    var nextPref = ORDER[(ORDER.indexOf(T.pref()) + 1) % ORDER.length];
    T.save(nextPref); T.apply(); themeLabel();
  });
  themeLabel();

  draw(false);
})();
</script>
</body>
</html>
